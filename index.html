<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>A Letter For You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap">
<style>
  /* Layout: one centered envelope on a dark wine night. The letter rises out of it, then
     slides away to the left while the rose line arrives from the right and a red rose
     bouquet grows on a full-screen canvas. Single deliberate look. */
  :root {
    --night: #25101c;
    --night-glow: #4d1e35;
    --env-back: #e3a2b3;
    --env-front-top: #f9d9df;
    --env-front: #f1bccb;
    --env-flap: #f6cdd7;
    --env-flap-in: #d58aa1;
    --paper: #fff9f7;
    --ink: #6a2140;
    --seal: #d92b4b;
    --hint: #f6b9c8;
    --rose-line: #ffdbe3;
    --rose-red: #ff5c7c;
    --font-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
    --font-ui: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background-color: var(--night);
    background-image: radial-gradient(ellipse at 50% 38%, var(--night-glow) 0%, var(--night) 68%);
    color: var(--hint);
    font-family: var(--font-ui);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  #bloom {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.8s;
  }
  #bloom.on { opacity: 1; }

  .scene {
    --w: max(230px, min(340px, 86vw, calc((100svh - 130px) / 1.65)));
    --eh: calc(var(--w) * 0.66);
    position: relative;
    z-index: 2;
    margin: auto;
    display: grid;
    justify-items: center;
    min-width: 0;
  }

  .stage {
    grid-area: 1 / 1;
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 1.5);
    transition: transform 0.9s cubic-bezier(0.6, 0, 0.2, 1), opacity 0.9s;
  }
  .scene.p2 .stage {
    transform: translateX(-70vw);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.9s cubic-bezier(0.6, 0, 0.2, 1), opacity 0.9s, visibility 0s 0.9s;
  }

  /* second scene: the rose line */
  .roses {
    grid-area: 1 / 1;
    width: min(92vw, 520px);
    height: calc(var(--w) * 1.5);
    padding-top: calc(var(--w) * 0.1);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    visibility: hidden;
    transition: visibility 0s 0.9s;
  }
  .scene.p2 .roses { visibility: visible; transition-delay: 0s; }
  .rose-line {
    margin: 0;
    max-width: 11em;
    text-align: center;
    text-wrap: balance;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: calc(var(--w) * 0.125);
    line-height: 1.15;
    color: var(--rose-line);
    opacity: 0;
    transform: translateX(70vw);
    transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.9s;
  }
  .rose-line b { color: var(--rose-red); font-weight: 700; }
  .scene.p2 .rose-line { opacity: 1; transform: none; transition-delay: 0.7s; }

  /* hint and arrow */
  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(var(--eh) + 4px);
    height: calc(var(--w) * 0.5);
    --aw: calc(var(--w) * 0.3);
    color: var(--hint);
    transition: opacity 0.4s;
    animation: bob 2.4s ease-in-out infinite;
  }
  .hint span {
    display: block;
    text-align: center;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: calc(var(--w) * 0.085);
    line-height: 1.1;
  }
  .hint svg {
    position: absolute;
    top: calc(var(--w) * 0.1);
    left: calc(50% - var(--aw) * 0.65);
    width: var(--aw);
    height: auto;
    stroke: currentColor;
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .open .hint { opacity: 0; animation: none; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(7px); }
  }

  /* envelope */
  .env {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--eh);
    perspective: 900px;
    transition: transform 0.3s;
  }
  .stage:not(.open) .env:hover { transform: translateY(-4px); }
  .back {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: var(--env-back);
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.5);
  }
  .pocket {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: 6px;
    background: linear-gradient(180deg, var(--env-front-top), var(--env-front));
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  }
  .flap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 55%;
    z-index: 4;
    background: var(--env-flap);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0;
    transition: transform 0.7s cubic-bezier(0.5, 0, 0.2, 1), background 0s 0.35s, z-index 0s 0.35s;
  }
  .open .flap {
    transform: rotateX(180deg);
    background: var(--env-flap-in);
    z-index: 1;
  }

  /* heart seal */
  .seal {
    position: absolute;
    left: 50%;
    top: 55%;
    z-index: 6;
    width: calc(var(--w) * 0.17);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: opacity 0.35s, transform 0.5s;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
  }
  .seal svg {
    display: block;
    width: 100%;
    height: auto;
    animation: beat 1.8s ease-in-out infinite;
  }
  .open .seal { opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
  .open .seal svg { animation: none; }
  @keyframes beat {
    0%, 40%, 100% { transform: scale(1); }
    10% { transform: scale(1.14); }
    22% { transform: scale(1.02); }
    30% { transform: scale(1.1); }
  }

  /* the letter */
  .letter {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: calc(var(--w) * 0.06);
    height: calc(var(--w) * 0.5);
    z-index: 2;
    overflow: hidden;
    border-radius: 4px;
    background: var(--paper);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
    transition: bottom 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.5s, height 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.5s;
  }
  .open .letter {
    bottom: calc(var(--w) * 0.3);
    height: calc(var(--w) * 1.1);
  }
  .letter-inner {
    padding: calc(var(--w) * 0.09);
    color: var(--ink);
    font-family: var(--font-hand);
    font-weight: 500;
    font-size: calc(var(--w) * 0.078);
    line-height: 1.3;
    display: flex;
    flex-direction: column;
    gap: calc(var(--w) * 0.035);
  }
  .letter-inner p {
    margin: 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.8s, transform 0.8s;
  }
  .letter-inner .l1 { font-size: 1.2em; font-weight: 700; }
  .letter-inner .l4 { margin-top: calc(var(--w) * 0.02); }
  .letter-inner .l5 { margin-top: calc(var(--w) * -0.015); display: flex; align-items: center; gap: 0.3em; font-size: 1.2em; font-weight: 700; }
  .letter-inner .l5 svg { width: 0.8em; height: 0.8em; fill: var(--seal); flex: none; }
  .open .letter-inner p { opacity: 1; transform: none; }
  .open .l1 { transition-delay: 1.7s; }
  .open .l2 { transition-delay: 2.3s; }
  .open .l3 { transition-delay: 2.9s; }
  .open .l4 { transition-delay: 3.5s; }
  .open .l5 { transition-delay: 4.1s; }

  /* click target */
  .hit {
    position: absolute;
    inset: 0;
    z-index: 8;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
  }
  .hit:focus-visible { outline: 3px solid var(--hint); outline-offset: 5px; }

  /* top buttons */
  .bar {
    position: fixed;
    z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 0;
    right: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s;
  }
  .bar.show { opacity: 1; }
  .bar.show .pill { pointer-events: auto; }
  .pill {
    padding: 8px 16px;
    border: 1.5px solid var(--hint);
    border-radius: 999px;
    background: transparent;
    color: var(--hint);
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .pill[hidden] { display: none; }
  .pill:hover { background: rgba(246, 185, 200, 0.14); }
  .pill:focus-visible { outline: 3px solid var(--hint); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 0.01s !important;
      transition-delay: 0s !important;
    }
  }
</style>
</head>
<body>


<canvas id="bloom" aria-hidden="true"></canvas>

<div class="bar" id="bar">
  <button class="pill" id="swap" type="button">See the roses</button>
  <button class="pill" id="again" type="button" hidden>Send more roses</button>
</div>

<main class="scene" id="scene">
  <div class="stage" id="stage">
    <div class="hint" aria-hidden="true">
      <span>Click the letter to open</span>
      <svg viewBox="0 0 80 90"><path d="M18 4 C4 34 20 62 52 80"/><path d="M43.4 66.5 L52 80 L36 79.6"/></svg>
    </div>

    <div class="env">
      <div class="back"></div>
      <div class="letter">
        <div class="letter-inner">
          <p class="l1">Hey Baddie,</p>
          <p class="l2">Missing you a lot.</p>
          <p class="l3">Can't wait to see you.</p>
          <p class="l4">From your passionate lover,</p>
          <p class="l5">Arsh
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </p>
        </div>
      </div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <defs>
            <radialGradient id="sealGrad" cx="35%" cy="30%" r="80%">
              <stop offset="0" stop-color="#ff6b86"/>
              <stop offset="1" stop-color="#c41f40"/>
            </radialGradient>
          </defs>
          <path fill="url(#sealGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <button class="hit" id="hit" type="button" aria-label="Open the letter"></button>
    </div>
  </div>

  <div class="roses" id="roses">
    <p class="rose-line">Too far from you, but here's a rose for my <b>rose</b>.</p>
  </div>
</main>

<script>
(function () {
  var scene = document.getElementById('scene');
  var stage = document.getElementById('stage');
  var hit = document.getElementById('hit');
  var bar = document.getElementById('bar');
  var swap = document.getElementById('swap');
  var again = document.getElementById('again');
  var cv = document.getElementById('bloom');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = 6.2832;

  var W = 0, H = 0, geo = null, petals = [], t0 = 0, last = 0, raf = 0;
  var opened = false, phase = 1, started = false;
  var autoTimer = 0, beginTimer = 0, clearTimer = 0, againTimer = 0;

  // rose positions relative to the gathering point, in bouquet-size units: [dx, dy, radius]
  var HEADS = [[-0.37, -0.22, 0.10], [0.37, -0.22, 0.10], [0, -0.52, 0.11], [-0.19, -0.40, 0.11],
               [0.19, -0.40, 0.11], [-0.10, -0.25, 0.115], [0.12, -0.24, 0.115]];
  // leaves: [dx, dy, angle]
  var LEAVES = [[-0.33, -0.20, -2.75], [0.33, -0.20, -0.39], [-0.25, -0.42, -2.2], [0.25, -0.42, -0.94],
                [-0.10, -0.55, -1.85], [0.10, -0.55, -1.29], [-0.30, -0.05, -3.0], [0.30, -0.05, -0.14]];

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function layout() {
    var B = Math.min(H * 0.55, W * 0.92, 520);
    var cx = W / 2, gy = H - 14 - B * 0.28;
    var heads = [];
    for (var i = 0; i < HEADS.length; i++) {
      heads.push({
        x: cx + HEADS[i][0] * B,
        y: gy + HEADS[i][1] * B,
        r: HEADS[i][2] * B,
        rot: Math.random() * TAU,
        phase: Math.random() * TAU
      });
    }
    geo = { B: B, cx: cx, gy: gy, heads: heads };
  }

  function makePetals() {
    petals = [];
    var n = reduce ? 0 : 16;
    for (var i = 0; i < n; i++) {
      petals.push({
        x: Math.random() * W,
        y: -Math.random() * H * 0.8,
        s: 5 + Math.random() * 5,
        vy: 25 + Math.random() * 35,
        vx: (Math.random() - 0.5) * 12,
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 2,
        ph: Math.random() * TAU
      });
    }
  }

  function stemPoint(h, s) {
    var sx = geo.cx, sy = geo.gy;
    var cx = sx + (h.x - sx) * 0.25, cy = sy + (h.y - sy) * 0.65;
    var u = 1 - s;
    return { x: u * u * sx + 2 * u * s * cx + s * s * h.x, y: u * u * sy + 2 * u * s * cy + s * s * h.y };
  }

  function drawLeaf(x, y, len, ang, g) {
    if (g <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.fillStyle = '#2f7d4f';
    ctx.strokeStyle = '#225c3a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(len / 2 * g, 0, len / 2 * g, len * 0.2 * g, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawRose(x, y, r, sc, rot) {
    if (sc <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.lineWidth = Math.max(1, r * 0.025);

    function ring(n, d, pr, color, off, rim) {
      for (var i = 0; i < n; i++) {
        var a = (i + off) / n * TAU;
        var px = Math.cos(a) * d, py = Math.sin(a) * d;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, TAU);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(55, 0, 15, 0.38)';
        ctx.stroke();
        if (rim) {
          ctx.beginPath();
          ctx.arc(px, py, pr * 0.84, a - 0.7, a + 0.7);
          ctx.strokeStyle = 'rgba(255, 150, 175, 0.32)';
          ctx.lineWidth = r * 0.04;
          ctx.stroke();
          ctx.lineWidth = Math.max(1, r * 0.025);
        }
      }
    }

    ctx.fillStyle = '#6f0c26';
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.02, 0, TAU);
    ctx.fill();
    ring(6, r * 0.6, r * 0.46, '#b8143a', 0, true);
    ring(5, r * 0.38, r * 0.4, '#cf1b43', 0.5, true);
    ring(4, r * 0.2, r * 0.3, '#e22d57', 0.2, false);

    ctx.beginPath();
    for (var t = 0; t <= 9; t += 0.25) {
      var rad = r * (0.04 + 0.035 * t), ang = t * 1.1;
      var sx = Math.cos(ang) * rad, sy = Math.sin(ang) * rad;
      if (t === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = 'rgba(60, 0, 18, 0.6)';
    ctx.lineWidth = r * 0.05;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.fillStyle = '#a50f33';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.07, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function drawWrap(cp) {
    var B = geo.B, cx = geo.cx, gy = geo.gy;
    var L = cx - B * 0.27, R = cx + B * 0.27, top = gy - B * 0.07, tip = gy + B * 0.28;
    ctx.save();
    ctx.globalAlpha = cp;
    ctx.translate(0, (1 - cp) * B * 0.12);
    ctx.fillStyle = '#e6aebd';
    poly([[L, top], [R, top], [cx, tip]]);
    ctx.fillStyle = '#f7dbe2';
    poly([[L, top], [cx + B * 0.03, top + B * 0.02], [cx - B * 0.01, tip]]);
    ctx.fillStyle = '#f1c3d0';
    poly([[R, top], [cx + B * 0.03, top + B * 0.02], [cx - B * 0.01, tip]]);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.lineWidth = Math.max(1, B * 0.006);
    ctx.beginPath();
    ctx.moveTo(L, top);
    ctx.lineTo(cx + B * 0.03, top + B * 0.02);
    ctx.lineTo(R, top);
    ctx.stroke();

    var by = gy + B * 0.045;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7a1230';
    ctx.lineWidth = B * 0.034;
    ctx.beginPath();
    ctx.moveTo(cx - B * 0.15, by);
    ctx.lineTo(cx + B * 0.15, by);
    ctx.stroke();

    ctx.strokeStyle = '#8a1331';
    ctx.lineWidth = B * 0.02;
    ctx.beginPath();
    ctx.moveTo(cx, by); ctx.lineTo(cx - B * 0.07, gy + B * 0.15);
    ctx.moveTo(cx, by); ctx.lineTo(cx + B * 0.07, gy + B * 0.15);
    ctx.stroke();

    ctx.fillStyle = '#a3183b';
    ctx.strokeStyle = '#6b0f27';
    ctx.lineWidth = B * 0.006;
    for (var s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.ellipse(cx + s * B * 0.06, by, B * 0.062, B * 0.034, s * -0.5, 0, TAU);
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = '#8a1331';
    ctx.beginPath();
    ctx.arc(cx, by, B * 0.026, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBouquet(el, now) {
    var B = geo.B, i, k, h, sp, pt;
    var cp = easeOutCubic(clamp(el / 900, 0, 1));

    for (k = 0; k < LEAVES.length; k++) {
      var lg = easeOutCubic(clamp((el - 700 - k * 120) / 800, 0, 1));
      drawLeaf(geo.cx + LEAVES[k][0] * B, geo.gy + LEAVES[k][1] * B, B * 0.26, LEAVES[k][2], lg);
    }

    ctx.strokeStyle = '#2d7549';
    ctx.lineWidth = Math.max(2, B * 0.014);
    ctx.lineCap = 'round';
    for (i = 0; i < geo.heads.length; i++) {
      h = geo.heads[i];
      sp = easeOutCubic(clamp((el - 500 - i * 90) / 1000, 0, 1));
      if (sp <= 0) continue;
      ctx.beginPath();
      for (k = 0; k <= 16; k++) {
        pt = stemPoint(h, k / 16 * sp);
        if (k === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    }

    for (i = 0; i < geo.heads.length; i++) {
      h = geo.heads[i];
      sp = easeOutCubic(clamp((el - 500 - i * 90) / 1000, 0, 1));
      var q = clamp((el - 900 - i * 230) / 1100, 0, 1);
      if (q <= 0) continue;
      pt = stemPoint(h, sp);
      var sway = Math.sin(now / 1600 + h.phase) * B * 0.004 * sp;
      drawRose(pt.x + sway, pt.y, h.r, easeOutBack(q), h.rot);
    }

    drawWrap(cp);
  }

  function draw(now, dt) {
    ctx.clearRect(0, 0, W, H);
    var el = now - t0;
    drawBouquet(el, now);
    if (!reduce && el > 3800) {
      var a = Math.min(1, (el - 3800) / 1500);
      for (var m = 0; m < petals.length; m++) {
        var p = petals[m];
        p.y += p.vy * dt;
        p.x += (Math.sin(now / 900 + p.ph) * 18 + p.vx) * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(205, 25, 62, ' + (0.8 * a) + ')';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    draw(now, dt);
    raf = requestAnimationFrame(frame);
  }

  function begin() {
    started = true;
    clearTimeout(clearTimer);
    size();
    layout();
    makePetals();
    cv.classList.add('on');
    if (reduce) {
      t0 = 0;
      draw(1e6, 0);
    } else {
      t0 = performance.now();
      last = t0;
      if (!raf) raf = requestAnimationFrame(frame);
    }
    clearTimeout(againTimer);
    againTimer = setTimeout(function () { if (phase === 2) again.hidden = false; }, reduce ? 0 : 5200);
  }

  function goRoses() {
    if (phase === 2) return;
    clearTimeout(autoTimer);
    phase = 2;
    scene.classList.add('p2');
    swap.textContent = 'Read the letter again';
    beginTimer = setTimeout(begin, reduce ? 0 : 1600);
  }

  function goLetter() {
    if (phase === 1) return;
    phase = 1;
    clearTimeout(beginTimer);
    clearTimeout(againTimer);
    scene.classList.remove('p2');
    swap.textContent = 'See the roses';
    again.hidden = true;
    cv.classList.remove('on');
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    clearTimer = setTimeout(function () { ctx.clearRect(0, 0, W, H); started = false; }, 900);
  }

  function openLetter() {
    if (opened) return;
    opened = true;
    stage.classList.add('open');
    hit.hidden = true;
    setTimeout(function () { bar.classList.add('show'); }, reduce ? 0 : 5200);
    autoTimer = setTimeout(goRoses, reduce ? 8000 : 10500);
  }

  hit.addEventListener('click', openLetter);
  swap.addEventListener('click', function () { if (phase === 1) goRoses(); else goLetter(); });
  again.addEventListener('click', begin);

  var rt = 0;
  window.addEventListener('resize', function () {
    if (!started || phase !== 2) return;
    clearTimeout(rt);
    rt = setTimeout(function () {
      size();
      layout();
      makePetals();
      if (reduce) { t0 = 0; draw(1e6, 0); } else { t0 = performance.now() - 9000; }
    }, 150);
  });
})();
</script>

</body>
</html>
